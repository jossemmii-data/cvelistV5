name: Sync Fork and Load to Snowflake
on:
  schedule:
    - cron: '00 * * * *'
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Step 1 -> Download repo code in the runner (ubuntu-latest)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2 -> Sync the fork
      ######### Credits: https://github.com/tgymnich/fork-sync
      - name: Sync Fork
        uses: tgymnich/fork-sync@v1.8
        with:
          owner: CVEProject
          base: main
          head: main
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      # Step 3 -> Initialize Snowflake CLI
      ######### Credits: https://github.com/marketplace/actions/install-snowflake-cli
      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          use-oidc: true
          cli-version: "3.11"

      # Step 4 -> Connect with Snowflake
      ######### Credits: https://github.com/marketplace/actions/install-snowflake-cli
      - name: Configure Snowflake Connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          mkdir -p ~/.snowflake                            # Create folder .snowflake
          cat > ~/.snowflake/config.toml << EOF            # stdin to config.toml. EOF start
          [connections.default]                            # Connection with previous variables
          account = "$SNOWFLAKE_ACCOUNT"
          database = "$SNOWFLAKE_DATABASE"
          schema = "$SNOWFLAKE_SCHEMA"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          authenticator = "WORKLOAD_IDENTITY"
          EOF                                              # EOF end
          chmod 0600 ~/.snowflake/config.toml              # [write, read] owner

      # Step 5 -> Get max date (from last ingestion) from Snow
      - name: Get max date from Snowflake
        id: max                                            # id to use in next Steps
        run: |
          MAX=$(snow sql -q "SELECT COALESCE(TO_VARCHAR(MAX(date_loaded), 'YYYY-MM-DD\"T\"HH24:MI:SS.FF3\"Z\"'), '1970-01-01T00:00:00.000Z') AS max FROM cve_vulnerabilities" --format json | jq -r '.[0].MAX')
          if [ -z "$MAX" ] || [ "$MAX" = "null" ]; then    # -z indicate MAX is empty
            echo "Error with the max date."
            exit 1
          fi
          echo "max=$MAX" >> $GITHUB_OUTPUT                # Show max in output
          echo "Max Date: $MAX"

      # Step 6 -> Call build_batch.py to build full json with changes
      - name: Build NDJSON batch
        id: build_batch
        env:
          MAX: ${{ steps.max.outputs.max }}
 
      # Step 7 -> Upload NDJSON to an internal stage
      - name: Upload batch to Snowflake stage
        if: steps.build_batch.outputs.has_changes == 'true'
        run: |
          snow sql -q "REMOVE @GIT_REPO_DEMO.GIT.CVE_UPLOAD_STAGE/batch.ndjson" || true
          snow stage copy /tmp/cve_upload/batch.ndjson @GIT_REPO_DEMO.GIT.CVE_UPLOAD_STAGE --overwrite
 
      # Step 8 -> Execute the procedure in Snowflake
      - name: Execute Procedure
        if: steps.build_batch.outputs.has_changes == 'true'
        run: |
          snow snowpark execute procedure "sync_cve_delta('@GIT_REPO_DEMO.GIT.CVE_UPLOAD_STAGE')"