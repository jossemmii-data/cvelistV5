name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: tgymnich/fork-sync@v1.8
        with:
          owner: CVEProject
          base: main
          head: main
          token: ${{ secrets.FORK_SYNC_TOKEN }}
