name: Sync Fork and Load to Snowflake
on:
  schedule:
    - cron: '00 * * * *'
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
 
      - name: Sync Fork
        uses: tgymnich/fork-sync@v1.8
        with:
          owner: CVEProject
          base: main
          head: main
          token: ${{ secrets.FORK_SYNC_TOKEN }}
 
      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          use-oidc: true
          cli-version: "3.11"
 
      - name: Configure Snowflake Connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.default]
          account = "$SNOWFLAKE_ACCOUNT"
          database = "$SNOWFLAKE_DATABASE"
          schema = "$SNOWFLAKE_SCHEMA"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          authenticator = "WORKLOAD_IDENTITY"
          EOF
          chmod 0600 ~/.snowflake/config.toml
 
      - name: Get cutoff date from Snowflake
        id: cutoff
        run: |
          CUTOFF=$(snow sql -q "SELECT COALESCE(MAX(date_loaded), '1970-01-01T00:00:00Z'::TIMESTAMP_NTZ)::STRING AS cutoff FROM cve_vulnerabilities" --format json | jq -r '.[0].CUTOFF')
          if [ -z "$CUTOFF" ] || [ "$CUTOFF" = "null" ]; then
            echo "Error: no se pudo obtener el cutoff"
            exit 1
          fi
          echo "cutoff=$CUTOFF" >> $GITHUB_OUTPUT
          echo "Cutoff: $CUTOFF"
 
      - name: Build NDJSON batch
        id: build_batch
        run: |
          python3 << 'EOF'
          import json, os
          from datetime import datetime, timezone
 
          cutoff_str = "${{ steps.cutoff.outputs.cutoff }}"
          # Normalizar: si no tiene tz, asumimos UTC
          if 'Z' in cutoff_str or '+' in cutoff_str:
              cutoff = datetime.fromisoformat(cutoff_str.replace('Z', '+00:00'))
          else:
              cutoff = datetime.fromisoformat(cutoff_str).replace(tzinfo=timezone.utc)
 
          with open('cves/deltaLog.json') as f:
              delta = json.load(f)
 
          # Ordenar bloques cronológicamente para que "el último gana"
          delta_sorted = sorted(
              delta,
              key=lambda b: datetime.fromisoformat(b['fetchTime'].replace('Z', '+00:00'))
          )
 
          # Deduplicar: nos quedamos con la última aparición de cada cve_id.
          # Si un CVE aparece como NEW y luego como UPDATED dentro del mismo lote,
          # sigue siendo un INSERT desde el punto de vista de Snowflake (no existía
          # antes), así que conservamos NEW pero con el contenido más reciente.
          latest = {}  # cve_id -> (action, githubLink)
          for block in delta_sorted:
              fetch_time = datetime.fromisoformat(block['fetchTime'].replace('Z', '+00:00'))
              if fetch_time <= cutoff:
                  continue
              for cve in block.get('new', []):
                  latest[cve['cveId']] = ('NEW', cve['githubLink'])
              for cve in block.get('updated', []):
                  prev = latest.get(cve['cveId'])
                  if prev and prev[0] == 'NEW':
                      # Mantener NEW, pero actualizar el link al más reciente
                      latest[cve['cveId']] = ('NEW', cve['githubLink'])
                  else:
                      latest[cve['cveId']] = ('UPDATED', cve['githubLink'])
 
          to_process = [(action, cve_id, link) for cve_id, (action, link) in latest.items()]
 
          if not to_process:
              print("No hay cambios nuevos")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("has_changes=false\n")
              exit(0)
 
          print(f"CVEs únicos a procesar: {len(to_process)}")
 
          os.makedirs('/tmp/cve_upload', exist_ok=True)
 
          count = 0
          missing = 0
          with open('/tmp/cve_upload/batch.ndjson', 'w') as out:
              for action, cve_id, link in to_process:
                  idx = link.index('/cves/')
                  path = link[idx + 1:]
                  if os.path.exists(path):
                      with open(path) as f:
                          content = json.load(f)
                      out.write(json.dumps({
                              "cve_id": cve_id,
                              "action": action,
                              "data": content
                      }) + '\n')
                      count += 1
                  else:
                      missing += 1
 
          print(f"Registros escritos en batch: {count}")
          if missing:
              print(f"Avisos: {missing} ficheros no encontrados en disco")
 
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              if count > 0:
                  f.write("has_changes=true\n")
              else:
                  f.write("has_changes=false\n")
          EOF
 
      - name: Upload batch to Snowflake stage
        if: steps.build_batch.outputs.has_changes == 'true'
        run: |
          snow sql -q "REMOVE @GIT_REPO_DEMO.GIT.CVE_UPLOAD_STAGE/batch.ndjson" || true
          snow stage copy /tmp/cve_upload/batch.ndjson @GIT_REPO_DEMO.GIT.CVE_UPLOAD_STAGE --overwrite
 
      - name: Execute Procedure
        if: steps.build_batch.outputs.has_changes == 'true'
        run: |
          snow snowpark execute procedure "sync_cve_delta('@GIT_REPO_DEMO.GIT.CVE_UPLOAD_STAGE')"
